<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TDT 技术项目状态看板 · V1.2.0</title>
<style>
:root {
  --bg: #fff; --surface: #fff; --surface-2: #f6f6f6;
  --ink: #363636; --muted: #787878; --line: #e2e2e2; --line-soft: #efefef;
  --accent: #0a9bf5; --accent-soft: #e6f4fe; --accent-ink: #fff;
  --head-cell-bg: var(--accent); --head-cell-ink: var(--accent-ink);
  --head-cell-line: rgba(255,255,255,.34);
  --table-line: var(--line); --table-zebra: var(--surface-2); --table-rule: #b8b8b8;
  --chart-grid: var(--line); --chart-axis: var(--ink);
  --risk-hi: #d44c47; --risk-hi-bg: #fdebec;
  --risk-mid: #a87608; --risk-mid-bg: #fbf3db;
  --risk-lo: #448361; --risk-lo-bg: #edf3ee;
  --head-bg: rgba(255,255,255,.94);
  --shadow: 0 1px 2px rgba(15,15,15,.04), 0 2px 8px rgba(15,15,15,.04);
  --nav-row-height: 36px;
  --presentation-header-height: 0px;
  --dashboard-font-family: "Aptos", "Segoe UI", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "微软雅黑", "Hiragino Sans GB", sans-serif;
  --table-font-size: 16px;
  --table-head-weight: 700;
  --table-body-weight: 400;
  --mono: "Consolas", "SF Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--dashboard-font-family);
  font-size: 13px; line-height: 1.55;
  padding-bottom: 24px;
  transition: background .2s, color .2s;
}
button { font: inherit; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
}

.sticky-head {
  position: sticky; top: 0; z-index: 20; background: var(--head-bg);
  backdrop-filter: blur(9px); border-bottom: 1px solid var(--line);
}
.head-inner, .wrap, footer { max-width: 1480px; margin: 0 auto; padding-inline: 24px; }
.topbar { display: flex; align-items: center; gap: 13px; padding: 12px 0 8px; flex-wrap: wrap; }
.topbar h1 { margin: 0; font-size: 18px; line-height: 1.4; font-weight: 700; letter-spacing: -0.01em; }
.meta { color: var(--muted); font-size: 12px; }
.meta b { color: var(--ink); font-size: 18px; }
.src-tag { color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px; font-size: 11px; }
.spacer { flex: 1; }
.ai-btn, .presentation-btn {
  border-radius: 6px; padding: 6px 13px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.ai-btn {
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  font-weight: 600; animation: ai-glow 2s ease-in-out infinite;
}
.ai-btn.done { background: var(--surface); color: var(--accent); animation: none; font-weight: 400; }
.ai-btn:disabled { opacity: .75; cursor: default; animation: none; }
.ai-btn.loading .ai-ic { animation: ai-spin 1s linear infinite; }
.presentation-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.presentation-btn:hover { border-color: var(--accent); color: var(--accent); }
.presentation-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.presentation-btn:disabled { opacity: .45; cursor: default; }
@keyframes ai-glow { 50% { box-shadow: 0 0 14px 1px var(--accent); } }
@keyframes ai-spin { to { transform: rotate(360deg); } }

html:fullscreen { background: var(--bg); }
body.presentation-mode { min-height: 100vh; background: var(--bg); }
body.presentation-mode .sticky-head {
  position: fixed; inset: 0 0 auto; z-index: 100;
  transition: transform .24s ease, opacity .24s ease;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .08);
}
body.presentation-mode.presentation-controls-hidden .sticky-head {
  transform: translateY(calc(-100% - 2px)); opacity: 0; pointer-events: none;
}
.presentation-header-spacer { height: 0; }
body.presentation-mode .presentation-header-spacer {
  height: var(--presentation-header-height);
}
.presentation-hotzone { display: none; }
body.presentation-mode .presentation-hotzone {
  display: block; position: fixed; inset: 0 0 auto; z-index: 110;
  height: 18px; pointer-events: none;
}
body.presentation-mode.presentation-controls-hidden .presentation-hotzone { pointer-events: auto; }
body.presentation-mode .ai-btn,
body.presentation-mode .src-tag,
body.presentation-mode #foot { display: none !important; }
body.presentation-mode #board { min-height: 100vh; }

.toolrow {
  display: grid; grid-template-columns: minmax(420px, 31%) minmax(0, 1fr);
  align-items: center; gap: 10px; min-height: calc(var(--nav-row-height) + 10px);
  padding-bottom: 10px;
}
.view-tabs {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px;
  height: var(--nav-row-height);
}
.view-tab {
  height: var(--nav-row-height); border: 1px solid var(--line); border-radius: 999px;
  padding: 0 13px; background: var(--surface); color: var(--ink);
  font-size: 13px; line-height: 1; font-weight: 600;
}
.view-tab:not(:disabled) { cursor: pointer; }
.view-tab.active { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.view-tab:disabled { background: var(--surface-2); color: var(--muted); opacity: .5; }
.pm-slider {
  display: flex; align-items: center; gap: 3px; min-width: 0; overflow-x: auto;
  height: var(--nav-row-height); padding: 0 0 2px;
  border-bottom: 2px solid var(--line); scrollbar-width: thin;
}
.pm-name {
  flex: 0 0 auto; border: 0; border-radius: 6px; padding: 4px 11px;
  background: transparent; color: var(--ink); cursor: pointer; white-space: nowrap;
}
.pm-name:not(.disabled):hover { background: var(--surface-2); }
.pm-name.current { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.pm-name.disabled { color: var(--muted); opacity: .4; cursor: default; }
.issue-summary {
  min-width: 0; height: var(--nav-row-height); display: flex; align-items: center;
  justify-content: space-between; gap: 12px; padding: 0 4px 2px;
  border-bottom: 2px solid var(--line);
}
.issue-summary-title { color: var(--ink); font-weight: 700; white-space: nowrap; }
.issue-stats { display: flex; align-items: center; justify-content: flex-end; gap: 7px; flex-wrap: wrap; }
.summary-pill {
  display: inline-flex; align-items: center; border-radius: 999px;
  padding: 3px 9px; background: var(--surface-2); color: var(--muted); white-space: nowrap;
}
.summary-pill.open { background: var(--risk-mid-bg); color: var(--risk-mid); }
.summary-pill.closed { background: var(--risk-lo-bg); color: var(--risk-lo); }

.stage { max-width: 1480px; margin: 0 auto; padding: 140px 24px; text-align: center; color: var(--muted); }
.stage-dots { display: flex; justify-content: center; gap: 7px; margin-bottom: 14px; }
.stage-dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); animation: ai-bounce 1s ease-in-out infinite; }
.stage-dots i:nth-child(2) { animation-delay: .15s; }
.stage-dots i:nth-child(3) { animation-delay: .3s; }
@keyframes ai-bounce { 50% { transform: translateY(-7px); opacity: .45; } }
.reveal { animation: reveal .35s ease-out both; }
@keyframes reveal { from { opacity: 0; transform: translateY(8px); } }

.wrap { padding-top: 18px; padding-bottom: 76px; }
#board {
  font-family: var(--dashboard-font-family);
  font-size: 13px;
  font-weight: 400;
}
#board table th,
#board table th *,
#board [role="columnheader"],
#board [role="columnheader"] * {
  font-family: var(--dashboard-font-family) !important;
  font-size: var(--table-font-size) !important;
  font-weight: var(--table-head-weight) !important;
}
#board table td,
#board table td *,
#board [role="cell"],
#board [role="cell"] *,
#board .table-body-text,
#board .table-body-text * {
  font-family: var(--dashboard-font-family) !important;
  font-size: var(--table-font-size) !important;
  font-weight: var(--table-body-weight) !important;
}
#board table tfoot th,
#board table tfoot th *,
#board table tfoot td,
#board table tfoot td * {
  font-weight: var(--table-body-weight) !important;
}
.pm-summary {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
}
#board .pm-summary {
  font-size: var(--table-font-size);
  font-weight: var(--table-body-weight);
}
#board .pm-summary h2 { margin: 0; font-size: inherit; font-weight: inherit; }
.pm-summary span { color: var(--muted); }
.tdt-section { margin-bottom: 24px; }
.tdt-scroll { overflow-x: auto; padding-bottom: 3px; }
.tdt-wide { min-width: 1320px; }
.tdt-overview {
  display: block; margin-bottom: 4px;
}
.overview-card, .head-cell, .data-cell {
  min-width: 0; background: var(--surface); overflow-wrap: anywhere;
}
.overview-card { border: 1px solid var(--table-line); }
.overview-card {
  display: flex; align-items: center; width: 100%;
  border-top: 3px solid var(--accent); border-radius: 6px; padding: 10px 14px;
  box-shadow: var(--shadow);
}
.overview-value { white-space: pre-wrap; }
#board .tdt-overview .overview-card {
  line-height: 1.45;
}

.task-grid {
  display: grid;
  grid-template-columns: minmax(0,10fr) minmax(0,7fr) minmax(0,7fr) minmax(0,6fr) minmax(0,7fr) minmax(0,13fr) minmax(0,20fr) minmax(0,20fr) minmax(0,10fr);
  gap: 0; align-items: stretch;
}
.task-grid + .task-grid { margin-top: 0; }
#board .head-cell {
  padding: 7px 6px; border: 0; border-right: 1px solid var(--head-cell-line); border-radius: 0;
  background: var(--head-cell-bg); color: var(--head-cell-ink); text-align: center;
  line-height: 1.35;
}
#board .task-grid > .head-cell:first-child { border-left: 1px solid var(--head-cell-line); }
#board .data-cell {
  display: flex; flex-direction: column; justify-content: center;
  padding: 10px 8px; border: 0; border-radius: 0;
  border-right: 1px solid var(--table-line); border-bottom: 1px solid var(--table-line);
  min-height: 124px; white-space: pre-wrap; line-height: 1.45;
}
#board [role="table"] > .task-grid:nth-of-type(odd) .data-cell { background: var(--table-zebra); }
#board .task-grid > .data-cell:first-child {
  border-left: 1px solid var(--table-line); border-right: 1px solid var(--table-rule);
}
.task-grid .data-cell:nth-child(-n+5) { align-items: center; text-align: center; }
.code { display: block; margin-top: 6px; color: var(--muted); }
.date-cell, .status-cell, .stage-cell { text-align: center; font-variant-numeric: tabular-nums; }
#board .data-cell.date-cell { padding-inline: 4px; white-space: nowrap; }
.cell-list { margin: 0; padding-left: 0; list-style: none; }
.cell-list li { margin-bottom: 5px; white-space: pre-wrap; }
.cell-list.compact { width: 100%; padding-left: 0; text-align: left; line-height: 1.5; }
.cell-list.progress-list, .cell-list.risk-text { line-height: 1.45; }
.cell-list.progress-list li, .cell-list.risk-text li { margin-bottom: 0; }
.cell-list.progress-list li + li, .cell-list.risk-text li + li { margin-top: 26px; }
.cell-list.risk-text li { color: var(--risk-hi); }
.badge {
  display: inline-block; padding: 3px 8px; border-radius: 999px;
  white-space: nowrap;
}
.badge.hi { color: var(--risk-hi); background: var(--risk-hi-bg); }
.badge.mid { color: var(--risk-mid); background: var(--risk-mid-bg); }
.badge.lo { color: var(--risk-lo); background: var(--risk-lo-bg); }
.badge.none { color: var(--muted); background: var(--surface-2); }

.issue-table-scroll { overflow-x: auto; padding-bottom: 3px; }
.issue-wrap { max-width: 1840px; }
.issue-week-section + .issue-week-section { margin-top: 32px; }
#board .issue-week-title {
  display: flex; align-items: center; gap: 8px; margin: 0 0 10px;
  font-size: 18px; line-height: 1.4; font-weight: 700;
}
.issue-week-title::before {
  content: ""; width: 4px; height: 18px; flex: 0 0 auto;
  border-radius: 999px; background: var(--accent);
}
.issue-table {
  width: 100%; min-width: 1380px; table-layout: fixed; border-collapse: collapse;
  border: 1px solid var(--table-line); background: var(--surface);
}
.issue-table th, .issue-table td {
  border: 1px solid var(--table-line); overflow-wrap: anywhere;
}
#board .issue-table th {
  height: 26px; padding: 3px 2px; line-height: 1.35;
  background: var(--head-cell-bg); color: var(--head-cell-ink);
  border-color: var(--head-cell-line);
  text-align: center; vertical-align: middle;
}
#board .issue-table td {
  height: 155px; padding: 12px 8px; vertical-align: middle; text-align: center;
  white-space: pre-wrap; line-height: 1.45;
}
#board .issue-table tbody tr:nth-child(even) td { background: var(--table-zebra); }
#board .issue-table td:first-child { border-right: 1px solid var(--table-rule); }
#board .issue-table td.issue-task-cell { text-align: left; }
.issue-task-section + .issue-task-section { margin-top: 13px; }
#board .issue-table td .issue-task-section strong { font-weight: 700 !important; }
.issue-status {
  display: inline-block; border-radius: 999px; padding: 3px 8px; white-space: nowrap;
}
.issue-status.open { background: var(--risk-mid-bg); color: var(--risk-mid); }
.issue-status.closed { background: var(--risk-lo-bg); color: var(--risk-lo); }
.issue-status.other { background: var(--surface-2); color: var(--muted); }

.meeting-wrap { max-width: 1480px; padding-bottom: 24px; }
.meeting-card {
  border: 1px solid var(--line); border-radius: 5px; padding: 50px 60px;
  background: var(--surface); box-shadow: var(--shadow);
}
.meeting-card + .meeting-card { margin-top: 30px; }
#board .meeting-title {
  margin: 0 0 18px; font-size: 24pt; line-height: 1.3; font-weight: 700;
  letter-spacing: -0.01em; text-wrap: balance;
}
.meeting-list { display: grid; gap: 20px; margin: 0; padding: 0; list-style: none; }
#board .meeting-item {
  display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 14px;
  align-items: start; font-size: 15pt; line-height: 1.55;
}
#board .meeting-item * { font-size: 15pt; }
.meeting-marker { line-height: 1.55; color: var(--ink); }
#board .meeting-part.danger { color: var(--risk-hi); font-weight: 700; }
#board .meeting-part.accent { color: var(--accent); font-weight: 700; }

.project-overview-wrap { max-width: 1480px; }
#board .project-overview-title {
  margin: 0 0 18px; font-size: 24pt; line-height: 1.3; font-weight: 700;
  letter-spacing: -0.01em; text-wrap: balance;
}
.project-overview-year { color: var(--accent); }
#board .project-overview-section-title { margin-top: 36px; }
.project-overview-card {
  border: 1px solid var(--line); border-radius: 8px; padding: 26px 28px 18px;
  background: var(--surface); box-shadow: var(--shadow); overflow: hidden;
}
.project-overview-card + .project-overview-card { margin-top: 24px; }
#board .project-overview-summary {
  margin: 0; font-size: 19px; line-height: 1.55; font-weight: 700;
}
#board .project-overview-summary strong {
  color: var(--accent); font-size: 24px; font-weight: 700;
}
.chart-axis { position: absolute; z-index: 0; pointer-events: none; }
.chart-axis-line {
  position: absolute; left: 0; right: 0; height: 0;
  border-top: 1px solid var(--chart-grid);
}
.chart-axis-line:first-child { border-top: 1.5px solid var(--chart-axis); }
#board .chart-axis-line span {
  position: absolute; right: 100%; top: 0; transform: translateY(-50%);
  padding-right: 9px; color: var(--muted); font-size: 13px; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.overview-chart-scroll { overflow-x: auto; padding: 28px 0 4px; scrollbar-width: thin; }
.overview-chart { position: relative; height: 390px; padding: 8px 10px 0 46px; }
.overview-chart .chart-axis { left: 46px; right: 10px; top: 52px; height: 226px; }
.overview-bars {
  position: relative; z-index: 1;
  display: grid; grid-template-columns: repeat(var(--track-count), minmax(54px, 1fr));
  gap: 10px; height: 360px; align-items: stretch;
}
.overview-bar-item { min-width: 0; height: 100%; }
.overview-bar-visual {
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  height: 270px;
}
#board .overview-bar-value {
  margin-bottom: 7px; color: var(--ink); font-size: 15px; line-height: 1; font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.overview-bar {
  width: 72%; min-width: 24px; max-width: 58px; min-height: 3px;
  border-radius: 0; background: var(--accent);
}
.overview-bar-label { position: relative; height: 90px; padding-top: 10px; }
#board .overview-bar-label span {
  position: absolute; top: 12px; left: 50%; display: block; white-space: nowrap;
  color: var(--muted); font-size: 14px; line-height: 1;
  transform: translateX(-50%);
}
.product-generation-chart-scroll { overflow-x: auto; padding: 28px 0 4px; scrollbar-width: thin; }
.product-generation-chart {
  position: relative; min-width: 760px; height: 340px; padding-left: 46px;
}
.product-generation-chart .chart-axis { left: 46px; right: 0; top: 0; height: 294px; }
.product-generation-bars {
  position: absolute; inset: 0 0 0 46px; z-index: 1;
  display: grid; grid-template-columns: repeat(var(--product-count), minmax(90px, 1fr)); gap: 24px;
}
.product-generation-item {
  display: grid; grid-template-rows: minmax(0, 1fr) 46px;
  min-width: 0; height: 100%; color: var(--muted); text-align: center;
}
.product-generation-bar-area {
  display: flex; align-items: flex-end; justify-content: center; min-height: 0;
}
.product-generation-bar {
  position: relative; width: 58%; min-width: 36px; max-width: 66px;
  border-radius: 0; background: var(--accent);
}
#board .product-generation-bar span {
  position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
  display: block; padding-bottom: 7px; color: var(--ink);
  font-size: 15px; line-height: 1; font-weight: 600; font-variant-numeric: tabular-nums;
}
#board .product-generation-label {
  padding-top: 12px; font-size: 14px; line-height: 1.2; white-space: nowrap;
}
.innovation-card { padding-bottom: 26px; }
.innovation-layout {
  display: grid; grid-template-columns: minmax(250px, 0.72fr) minmax(680px, 1.65fr);
  gap: 28px; align-items: stretch;
}
.innovation-summary-panel {
  min-height: 238px; height: 100%; padding: 22px 20px; border: 1px solid var(--line);
  border-radius: 7px; background: var(--surface);
  display: flex; flex-direction: column; justify-content: center;
}
#board .innovation-summary-line {
  margin: 0 0 28px; font-size: 18px; line-height: 1.65; font-weight: 700;
}
#board .innovation-summary-line strong {
  color: var(--accent); font-size: 24px; font-weight: 700;
}
#board .innovation-risk-summary { font-size: 18px; font-weight: 700; }
#board .innovation-risk-summary.is-normal { color: var(--risk-lo); }
#board .innovation-risk-summary.is-medium { color: var(--risk-mid); }
#board .innovation-risk-summary.is-high { color: var(--risk-hi); }
.innovation-stat-list { display: grid; gap: 16px; margin: 0; }
.innovation-stat-row {
  display: grid; grid-template-columns: 72px 82px; align-items: baseline;
  justify-content: center; column-gap: 14px;
  padding-bottom: 10px; border-bottom: 1px solid var(--line);
}
.innovation-stat-row:last-child { padding-bottom: 0; border-bottom: 0; }
#board .innovation-stat-row dt { color: var(--muted); font-size: 15px; text-align: right; }
#board .innovation-stat-row dd { margin: 0; font-size: 15px; text-align: left; }
#board .innovation-stat-row strong {
  color: var(--accent); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.innovation-table-scroll { min-width: 0; height: 100%; overflow: auto; }
.innovation-table {
  width: 100%; height: 100%; min-width: 900px; table-layout: fixed; border-collapse: collapse;
  border: 1px solid var(--line); background: var(--surface);
}
.innovation-table th, .innovation-table td { border: 1px solid var(--table-line); }
#board .innovation-table th {
  padding: 9px 10px; background: var(--head-cell-bg); color: var(--head-cell-ink);
  border-color: var(--head-cell-line);
  line-height: 1.35; text-align: left;
}
#board .innovation-table td {
  padding: 9px 10px; line-height: 1.45; vertical-align: middle;
}
#board .innovation-table tbody tr:nth-child(even) td { background: var(--table-zebra); }
#board .innovation-table td:first-child { border-right: 1px solid var(--table-rule); }
#board .innovation-table td:first-child { white-space: pre-line; }
#board .innovation-table th:not(:first-child),
#board .innovation-table td:not(:first-child) { text-align: center; }

#board .development-section-title {
  display: flex; align-items: center; gap: 14px;
}
#board .development-section-title::before {
  content: ""; width: 20px; height: 20px; flex: 0 0 20px;
  background: var(--ink); transform: rotate(45deg);
}
.development-card { padding: 24px 26px 26px; }
.development-layout {
  display: grid; grid-template-columns: minmax(0, 2.1fr) minmax(340px, .95fr);
  gap: 28px; align-items: stretch;
}
.development-table-panel { min-width: 0; }
.development-table-scroll {
  max-height: 500px; overflow: auto; border: 1px solid var(--table-line);
  scrollbar-width: thin;
}
.development-table {
  width: 100%; min-width: 820px; table-layout: fixed;
  border-collapse: separate; border-spacing: 0; background: var(--surface);
}
.development-table th, .development-table td {
  border-right: 1px solid var(--table-line); border-bottom: 1px solid var(--table-line);
}
.development-table tr > :last-child { border-right: 0; }
#board .development-table thead th {
  position: sticky; top: 0; z-index: 2; padding: 10px 12px;
  background: var(--head-cell-bg); color: var(--head-cell-ink);
  border-right-color: var(--head-cell-line); border-bottom-color: var(--head-cell-line);
  line-height: 1.35; text-align: center;
}
#board .development-table tbody td {
  height: 58px; padding: 10px 12px; line-height: 1.45; vertical-align: middle;
}
#board .development-table tbody tr:nth-child(even) td { background: var(--table-zebra); }
#board .development-table tbody td:first-child { border-right: 1px solid var(--table-rule); }
#board .development-table tbody td:nth-child(odd) { text-align: center; }
#board .development-table tfoot th,
#board .development-table tfoot td {
  position: sticky; bottom: 0; z-index: 1; height: 42px; padding: 8px 12px;
  background: var(--surface); border-top: 1px solid var(--table-rule);
  line-height: 1.3; text-align: center;
}
.development-summary-panel {
  min-height: 420px; padding: 20px 18px; border: 1px solid var(--ink);
  background: var(--surface);
}
#board .development-summary-lead,
#board .development-summary-lead > span {
  font-family: var(--dashboard-font-family);
  font-size: var(--table-font-size);
  font-weight: var(--table-body-weight);
}
#board .development-summary-lead {
  margin: 0; line-height: 1.75;
}
#board .development-summary-lead strong {
  color: var(--accent); font-size: 23px; font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.development-rate-help {
  position: relative; display: inline-flex; margin-left: 7px; vertical-align: middle;
}
.development-rate-icon {
  display: inline-grid; width: 24px; height: 24px; padding: 0;
  place-items: center; border: 1px solid var(--line); border-radius: 50%;
  background: var(--surface); color: var(--muted); font: 700 16px/1 "Microsoft YaHei", sans-serif;
  cursor: help;
}
.development-rate-icon:hover { border-color: var(--muted); background: var(--surface-2); color: var(--ink); }
.development-rate-icon:focus-visible { outline: 2px solid var(--muted); outline-offset: 2px; }
.development-rate-popover {
  position: absolute; top: calc(100% + 6px); left: 50%; z-index: 10;
  width: min(390px, calc(100vw - 48px)); padding: 14px 16px;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); box-shadow: 0 10px 30px rgba(0, 0, 0, .16);
  color: var(--ink); text-align: left;
  opacity: 0; visibility: hidden; pointer-events: none;
  transform: translate(-50%, -4px); transition: opacity .16s ease, transform .16s ease, visibility .16s;
}
.development-rate-popover::before {
  content: ""; position: absolute; top: -6px; left: calc(50% - 6px);
  width: 10px; height: 10px; border-left: 1px solid var(--line); border-top: 1px solid var(--line);
  background: var(--surface); transform: rotate(45deg);
}
.development-rate-help:hover .development-rate-popover,
.development-rate-help:focus-within .development-rate-popover {
  opacity: 1; visibility: visible; pointer-events: auto; transform: translate(-50%, 0);
}
.development-rate-popover .development-formula { margin: 0 0 12px; }
#board .development-formula-label {
  margin: 0 0 8px; font-size: 15px; line-height: 1.5; font-weight: 700;
}
#board .development-formula-text {
  margin: 0; font-size: 16px; line-height: 1.7; text-align: center; font-weight: 500;
}
.development-definition {
  margin: 0 0 22px; padding: 12px 14px; border-radius: 6px;
  background: var(--surface-2); color: var(--muted);
}
.development-rate-popover .development-definition { margin: 0; }
#board .development-definition p { margin: 0; font-size: 12px; line-height: 1.65; }
#board .development-definition p + p { margin-top: 5px; }
.development-status-list {
  display: grid; gap: 10px; margin: 22px 0 0; padding: 0; list-style: none;
}
#board .development-status-item {
  display: flex; align-items: baseline; gap: 7px; font-size: 17px; line-height: 1.45;
}
.development-status-dot { color: var(--ink); }
#board .development-status-item strong { font-size: 17px; font-weight: 700; }
#board .development-status-count {
  color: var(--accent); font-size: 21px; font-weight: 700;
  font-variant-numeric: tabular-nums;
}
#board .development-status-new { color: var(--ink); font-size: 14px; }

#board .board-empty {
  color: var(--muted); text-align: center; padding: 70px 0;
  font-size: var(--table-font-size); font-weight: var(--table-body-weight);
}
footer { padding-bottom: 36px; color: var(--muted); font-size: 12px; }
.copyright-mark {
  position: fixed; right: 16px; bottom: 6px; z-index: 30;
  color: var(--muted); font-size: 12px; line-height: 1.2; opacity: .62;
  pointer-events: none; user-select: none;
}

@media (max-width: 900px) {
  .head-inner, .wrap, footer { padding-inline: 14px; }
  .toolrow {
    grid-template-columns: 1fr;
    min-height: calc(var(--nav-row-height) * 2 + 10px);
  }
  .tdt-wide { min-width: 1180px; }
  .meeting-card { padding: 20px 18px; }
  .project-overview-card { padding: 22px 18px 14px; }
  .innovation-layout { grid-template-columns: 1fr; }
  .innovation-summary-panel { min-height: 0; }
  .development-layout { grid-template-columns: 1fr; }
  .development-summary-panel { min-height: 0; }
}
@media (max-width: 560px) {
  .topbar h1 { width: 100%; }
  .view-tab { padding-inline: 7px; font-size: 12px; }
  .pm-summary { align-items: flex-start; flex-direction: column; }
  .issue-summary { align-items: flex-start; flex-direction: column; }
  .issue-stats { justify-content: flex-start; }
}
</style>
</head>
<body>

<div class="presentation-hotzone" id="presentation-hotzone" aria-hidden="true"></div>
<header class="sticky-head" id="sticky-head">
  <div class="head-inner">
    <div class="topbar">
      <h1>TDT 技术项目状态看板 V1.2.0</h1>
      <span class="meta" id="meta"></span>
      <span class="src-tag" id="src-tag"></span>
      <span class="spacer"></span>
      <button type="button" class="ai-btn" id="ai-btn"><span class="ai-ic" aria-hidden="true">✦</span><span id="ai-btn-text">AI 看板</span></button>
      <button type="button" class="presentation-btn" id="presentation-btn" aria-pressed="false" disabled><span aria-hidden="true">⛶</span><span id="presentation-btn-text">演示模式</span></button>
    </div>
    <div class="toolrow" id="toolrow" hidden>
      <div class="view-tabs" aria-label="看板视图">
        <button type="button" class="view-tab" id="meeting-tab" aria-pressed="false">会议纪律</button>
        <button type="button" class="view-tab" id="overview-tab" aria-pressed="false">项目概况</button>
        <button type="button" class="view-tab active" id="progress-tab" aria-pressed="true">详细进展</button>
        <button type="button" class="view-tab" id="issue-tab" aria-pressed="false">遗留问题</button>
      </div>
      <nav class="pm-slider" id="pm-slider" aria-label="项目经理，可用左右方向键切换" aria-keyshortcuts="ArrowLeft ArrowRight"></nav>
      <div class="issue-summary" id="issue-summary" hidden></div>
    </div>
  </div>
</header>
<div class="presentation-header-spacer" id="presentation-header-spacer" aria-hidden="true"></div>

<div class="stage" id="stage">
  <div class="stage-dots" id="stage-dots" hidden><i></i><i></i><i></i></div>
  <p id="stage-hint">点击右上角「AI 看板」，生成本周项目状态</p>
</div>

<div id="board" hidden></div>
<footer id="foot" hidden></footer>
<div class="copyright-mark" aria-hidden="true">Designed by Siyuan for TRD</div>

<script>
let DATA = /*__DATA__*/null;

const RISK_CLS = { "高风险": "hi", "中风险": "mid", "低风险": "lo", "/": "none" };
let curPm = 0;
let currentView = "progress";

function esc(value) {
  return String(value == null ? "" : value).replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[char]);
}

function riskCls(risk) { return RISK_CLS[risk] || "none"; }

// Runtime Base-mapping contract: only null, empty text, and whitespace render
// blank. Filtering and lossy business transformations must happen explicitly
// upstream; this renderer never treats a nonempty Base value as a placeholder.
function cellText(value) {
  return String(value == null ? "" : value).trim();
}

function listHtml(items, className) {
  const values = (items || []).map(cellText).filter(Boolean);
  if (!values.length) return "";
  return `<ul class="cell-list ${className || ""}">${values.map(item => `<li>${esc(item)}</li>`).join("")}</ul>`;
}

function textHtml(value) {
  return esc(cellText(value)).replace(/\r?\n/g, "<br>");
}

function issueTaskHtml(value) {
  const text = cellText(value);
  if (!text) return "";
  const sections = text.split(/(?=(?:问题点|需求)\s*[：:])/).filter(Boolean);
  return sections.map(section => {
    const match = section.trim().match(/^(问题点|需求)\s*[：:]\s*([\s\S]*)$/);
    if (!match) return `<div class="issue-task-section">${textHtml(section.trim())}</div>`;
    return `<div class="issue-task-section"><strong>${esc(match[1])}：</strong>${textHtml(match[2].trim())}</div>`;
  }).join("");
}

function peopleHtml(value) {
  const text = cellText(value);
  if (!text) return "";
  const names = text.split(/[\/／、\r\n]+/).map(name => name.trim()).filter(Boolean);
  if (names.length <= 1) return esc(text);
  return names.map(esc).join("<br>");
}

function meetingPartHtml(part) {
  const text = esc(part && part.text);
  const tone = part && (part.tone === "danger" || part.tone === "accent") ? part.tone : "";
  return tone ? `<span class="meeting-part ${tone}">${text}</span>` : text;
}

function meetingDisciplineView() {
  const discipline = DATA.meetingDiscipline || { enabled: false, sections: [] };
  const sections = Array.isArray(discipline.sections) ? discipline.sections : [];
  if (!discipline.enabled || !sections.length) {
    return '<main class="wrap board-empty">当前没有可展示的会议内容</main>';
  }
  return `<main class="wrap meeting-wrap" id="meeting-content">
    ${sections.map(section => `<section class="meeting-card">
      <h2 class="meeting-title">${esc(section.title)}</h2>
      <ul class="meeting-list">${(section.items || []).map(item => `<li class="meeting-item">
        <span class="meeting-marker" aria-hidden="true">${item.marker === "square" ? "■" : "◆"}</span>
        <span>${(item.parts || []).map(meetingPartHtml).join("")}</span>
      </li>`).join("")}</ul>
    </section>`).join("")}
  </main>`;
}

function issueStatusClass(status) {
  const value = String(status || "").toUpperCase();
  if (value === "OPEN") return "open";
  if (value === "CLOSED") return "closed";
  return "other";
}

function chartScale(max) {
  const safeMax = Math.max(Number(max) || 0, 1);
  const rough = Math.max(safeMax / 4, 1);
  const magnitude = Math.pow(10, Math.floor(Math.log10(rough)));
  const step = [1, 2, 2.5, 5, 10]
    .map(unit => unit * magnitude)
    .find(candidate => candidate >= rough) || magnitude * 10;
  const top = Math.ceil(safeMax / step) * step;
  const ticks = [];
  for (let value = 0; value <= top + step / 1000; value += step) {
    ticks.push(Math.round(value * 100) / 100);
  }
  return { top, ticks };
}

function chartAxisHtml(scale) {
  return `<div class="chart-axis" aria-hidden="true">${scale.ticks
    .map(value => `<div class="chart-axis-line" style="bottom:${(value / scale.top * 100).toFixed(3)}%"><span>${value}</span></div>`)
    .join("")}</div>`;
}

function projectOverviewView() {
  const overview = DATA.projectOverview || { total: 0, trackCount: 0, tracks: [] };
  const dashboardYear = Number(DATA.dashboardYear);
  const overviewYear = Number.isInteger(dashboardYear)
    ? `<span class="project-overview-year">${dashboardYear}年</span>`
    : "";
  const tracks = overview.tracks || [];
  if (!tracks.length) {
    return '<main class="wrap project-overview-wrap"><div class="board-empty">当前没有可展示的赛道数据</div></main>';
  }
  const maxCount = Math.max(...tracks.map(track => Number(track.count) || 0), 1);
  const trackScale = chartScale(maxCount);
  const chartWidth = Math.max(1060, tracks.length * 72);
  const bars = tracks.map(track => {
    const count = Number(track.count) || 0;
    const height = Math.max(3, Math.round(count / trackScale.top * 226));
    const label = track.label || track.name || "未命名赛道";
    return `<div class="overview-bar-item" aria-label="${esc(label)}：${count} 个子任务">
      <div class="overview-bar-visual">
        <span class="overview-bar-value">${count}</span>
        <div class="overview-bar" style="height:${height}px"></div>
      </div>
      <div class="overview-bar-label"><span>${esc(label)}</span></div>
    </div>`;
  }).join("");
  const productGenerations = (overview.productGenerations || []).map(item => ({
    label: item.label || item.name || "未命名分类",
    count: Number(item.count) || 0,
  }));
  const productChartWidth = Math.max(760, productGenerations.length * 130);
  const maxGenerationCount = Math.max(...productGenerations.map(item => item.count), 1);
  const generationScale = chartScale(maxGenerationCount);
  const generationBars = productGenerations.map(item => {
    const height = item.count > 0 ? Math.max(3, item.count / generationScale.top * 100) : 0;
    return `<div class="product-generation-item" aria-label="${esc(item.label)}：${item.count} 个">
      <div class="product-generation-bar-area">
        <div class="product-generation-bar" style="height:${height.toFixed(2)}%"><span>${item.count}</span></div>
      </div>
      <div class="product-generation-label">${esc(item.label)}</div>
    </div>`;
  }).join("");
  const generationAria = productGenerations
    .map(item => `${item.label} ${item.count} 个`)
    .join("，") || "当前没有已填写的规划导入产品代";
  const generationSummary = productGenerations.length
    ? `规划导入${productGenerations
      .map(item => `${esc(item.label)}的是<strong>${item.count}</strong>个`)
      .join("，")}`
    : "当前没有已填写的规划导入产品代";
  const innovation = DATA.innovationCompetition || { enabled: false, projects: [] };
  const innovationRiskClass = Number(innovation.highRisk || 0) > 0
    ? "is-high"
    : Number(innovation.mediumRisk || 0) > 0
      ? "is-medium"
      : "is-normal";
  const innovationRiskSummary = innovation.riskSummary
    ? `，<span class="innovation-risk-summary ${innovationRiskClass}">${esc(innovation.riskSummary)}</span>`
    : "";
  const innovationRows = (innovation.projects || []).map(project => `<tr>
    <td>${textHtml(project.name)}</td>
    <td>${textHtml(project.track)}</td>
    <td>${textHtml(project.stage)}</td>
    <td>${textHtml(project.status)}</td>
    <td>${textHtml(project.risk)}</td>
  </tr>`).join("");
  const innovationSection = innovation.enabled ? `<section class="project-overview-card innovation-card" aria-label="创新大赛项目概况">
      <div class="innovation-layout">
        <div class="innovation-summary-panel">
          <p class="innovation-summary-line">创新大赛项目总数<strong>${innovation.total}</strong>个${innovationRiskSummary}。</p>
          <dl class="innovation-stat-list">
            <div class="innovation-stat-row"><dt>进行中</dt><dd><strong>${innovation.inProgress}</strong> 个</dd></div>
            <div class="innovation-stat-row"><dt>已完成</dt><dd><strong>${innovation.completed}</strong> 个</dd></div>
            <div class="innovation-stat-row"><dt>已取消</dt><dd><strong>${innovation.canceled}</strong> 个</dd></div>
          </dl>
        </div>
        <div class="innovation-table-scroll">
          <table class="innovation-table" aria-label="创新大赛项目明细">
            <colgroup><col style="width:28%"><col style="width:18%"><col style="width:18%"><col style="width:18%"><col style="width:18%"></colgroup>
            <thead><tr><th scope="col">项目名称</th><th scope="col">技术赛道</th><th scope="col">项目阶段</th><th scope="col">项目状态</th><th scope="col">项目风险</th></tr></thead>
            <tbody>${innovationRows}</tbody>
          </table>
        </div>
      </div>
    </section>` : "";
  const development = DATA.developmentSummary || { enabled: false };
  const newInDevelopment = development.newInDevelopment || [];
  const newCompleted = development.newCompleted || [];
  const developmentRowCount = Math.max(newInDevelopment.length, newCompleted.length, 1);
  const developmentRows = Array.from({ length: developmentRowCount }, (_, index) => {
    const developing = newInDevelopment[index];
    const completed = newCompleted[index];
    return `<tr>
      <td>${developing ? textHtml(developing.track) : ""}</td>
      <td>${developing ? textHtml(developing.name) : ""}</td>
      <td>${completed ? textHtml(completed.track) : ""}</td>
      <td>${completed ? textHtml(completed.name) : ""}</td>
    </tr>`;
  }).join("");
  const statusCounts = development.statusCounts || {};
  const riskCounts = development.riskCounts || {};
  const achievementRate = development.achievementRate;
  const achievementRateText = achievementRate !== null
    && achievementRate !== undefined
    && Number.isFinite(Number(achievementRate))
    ? Number(achievementRate).toFixed(1)
    : "—";
  const completedDefinition = (development.completedStatuses || []).join("＋");
  const developmentSection = development.enabled ? `<h2 class="project-overview-title project-overview-section-title development-section-title" id="development-section-title">${overviewYear}TDT项目子任务开发达成概况</h2>
    <section class="project-overview-card development-card" aria-labelledby="development-section-title">
      <div class="development-layout">
        <div class="development-table-panel">
          <div class="development-table-scroll">
            <table class="development-table" aria-label="本周新增开发中和新增已结项子任务">
              <colgroup><col style="width:13%"><col style="width:37%"><col style="width:13%"><col style="width:37%"></colgroup>
              <thead><tr><th colspan="2" scope="colgroup">新增开发中（TDT项目子任务）</th><th colspan="2" scope="colgroup">新增已结项（TDT项目子任务）</th></tr></thead>
              <tbody>${developmentRows}</tbody>
              <tfoot><tr><th scope="row">合计</th><td>${newInDevelopment.length}</td><th scope="row">合计</th><td>${newCompleted.length}</td></tr></tfoot>
            </table>
          </div>
        </div>
        <aside class="development-summary-panel" aria-label="TDT项目子任务开发达成统计">
          <div class="development-summary-lead">
            <span>${overviewYear}截至目前TDT项目子任务总数<strong>${development.total || 0}</strong>个，全年预估达成率约<strong>${achievementRateText}%</strong>。</span>
            <div class="development-rate-help">
              <button class="development-rate-icon" type="button" aria-label="查看全年预估达成率公式和统计口径" aria-describedby="development-rate-popover">☺</button>
              <div class="development-rate-popover" id="development-rate-popover" role="tooltip">
                <div class="development-formula">
                  <p class="development-formula-label">全年预估达成率公式：</p>
                  <p class="development-formula-text">（1－（中风险＋高风险＋延期＋fail）÷<br>（开发中＋已结项））×100%</p>
                </div>
                <div class="development-definition">
                  <p>当前统计口径：延期＝${riskCounts.delayed || 0}，fail＝${riskCounts.fail || 0}。</p>
                  <p>已结项＝${esc(completedDefinition)}。</p>
                  <p>延期／fail：项目状态中分别包含「延期」／「fail」的记录。</p>
                  <p>同一项目状态同时包含两词时，分别计入公式分子的对应项。</p>
                </div>
              </div>
            </div>
          </div>
          <ul class="development-status-list">
            <li class="development-status-item"><span class="development-status-dot">●</span><strong>开发中</strong><span class="development-status-count">${statusCounts.inDevelopment || 0}</span><span>个</span><span class="development-status-new">（新增${newInDevelopment.length}个）</span></li>
            <li class="development-status-item"><span class="development-status-dot">●</span><strong>已结项</strong><span class="development-status-count">${statusCounts.completed || 0}</span><span>个</span><span class="development-status-new">（新增${newCompleted.length}个）</span></li>
            <li class="development-status-item"><span class="development-status-dot">●</span><strong>暂停</strong><span class="development-status-count">${statusCounts.paused || 0}</span><span>个</span></li>
            <li class="development-status-item"><span class="development-status-dot">●</span><strong>取消</strong><span class="development-status-count">${statusCounts.canceled || 0}</span><span>个</span></li>
            <li class="development-status-item"><span class="development-status-dot">●</span><strong>驳回</strong><span class="development-status-count">${statusCounts.rejected || 0}</span><span>个</span></li>
          </ul>
        </aside>
      </div>
    </section>` : "";
  return `<main class="wrap project-overview-wrap" id="project-overview-content">
    <h2 class="project-overview-title">${overviewYear}TDT项目价值概况</h2>
    <section class="project-overview-card" aria-label="TDT项目子任务赛道分布">
      <p class="project-overview-summary">${overviewYear}截至本周，TDT项目子任务总数<strong>${overview.total}</strong>个，分布在<strong>${overview.trackCount}</strong>个赛道。</p>
      <div class="overview-chart-scroll">
        <div class="overview-chart" style="min-width:${chartWidth}px" role="img" aria-label="${overview.trackCount} 个赛道，共 ${overview.total} 个子任务">
          ${chartAxisHtml(trackScale)}
          <div class="overview-bars" style="--track-count:${tracks.length}">${bars}</div>
        </div>
      </div>
    </section>
    <section class="project-overview-card" aria-label="规划导入产品代分布">
      <p class="project-overview-summary">${overviewYear}截止本周，${generationSummary}。</p>
      <div class="product-generation-chart-scroll">
        <div class="product-generation-chart" style="min-width:${productChartWidth}px" role="img" aria-label="${esc(generationAria)}">
          ${chartAxisHtml(generationScale)}
          <div class="product-generation-bars" style="--product-count:${Math.max(productGenerations.length, 1)}">${generationBars}</div>
        </div>
      </div>
    </section>
    ${innovationSection}
    ${developmentSection}
  </main>`;
}

function groupByTdt(projects) {
  const result = [];
  const index = new Map();
  projects.forEach(project => {
    const key = project.tdt || "未指定 TDT";
    if (!index.has(key)) {
      index.set(key, result.length);
      result.push({ name: key, summary: project.tdtSummary || "", projects: [] });
    }
    const group = result[index.get(key)];
    if (!group.summary && project.tdtSummary) group.summary = project.tdtSummary;
    group.projects.push(project);
  });
  return result;
}

function headerRow() {
  return `<div class="task-grid" role="row">
    ${["子任务名称", "价值决策", "结项时间", "风险状态", "项目阶段", "控制点", "本周进展", "下周计划", "风险"]
      .map(label => `<div class="head-cell" role="columnheader">${label}</div>`).join("")}
  </div>`;
}

function taskRow(project) {
  const code = cellText(project.code);
  const risk = cellText(project.risk);
  const riskItems = project.riskDesc || [];
  return `<div class="task-grid" role="row">
    <div class="data-cell name" role="cell">${textHtml(project.name)}${code ? `<span class="code">${esc(code)}</span>` : ""}</div>
    <div class="data-cell date-cell" role="cell">${textHtml(project.valueDecision)}</div>
    <div class="data-cell date-cell" role="cell">${textHtml(project.closeDate)}</div>
    <div class="data-cell status-cell" role="cell">${risk ? `<span class="badge ${riskCls(risk)}">${esc(risk)}</span>` : ""}</div>
    <div class="data-cell stage-cell" role="cell">${textHtml(project.stage)}</div>
    <div class="data-cell" role="cell">${listHtml(project.cps, "compact")}</div>
    <div class="data-cell" role="cell">${listHtml(project.week, "progress-list")}</div>
    <div class="data-cell" role="cell">${listHtml(project.next, "progress-list")}</div>
    <div class="data-cell" role="cell">${listHtml(riskItems, project.riskDesc && project.riskDesc.length ? "risk-text" : "")}</div>
  </div>`;
}

function tdtSection(tdt) {
  return `<section class="tdt-section">
    <div class="tdt-scroll">
      <div class="tdt-wide">
        <div class="tdt-overview">
          <div class="overview-card overview-value table-body-text">${esc(tdt.name)}</div>
        </div>
        <div role="table" aria-label="${esc(tdt.name)}子任务进展">
          ${headerRow()}
          ${tdt.projects.map(taskRow).join("")}
        </div>
      </div>
    </div>
  </section>`;
}

function issueRow(issue) {
  const status = cellText(issue.status);
  return `<tr>
    <td>${textHtml(issue.item)}</td>
    <td class="issue-left">${textHtml(issue.taskName)}</td>
    <td class="issue-task-cell">${issueTaskHtml(issue.task)}</td>
    <td class="issue-left">${textHtml(issue.progress)}</td>
    <td>${textHtml(issue.plannedDate)}</td>
    <td>${textHtml(issue.adjustedDate)}</td>
    <td>${textHtml(issue.actualDate)}</td>
    <td>${peopleHtml(issue.proposer)}</td>
    <td class="issue-left">${textHtml(issue.department)}</td>
    <td>${peopleHtml(issue.owner)}</td>
    <td>${status ? `<span class="issue-status ${issueStatusClass(status)}">${esc(status)}</span>` : ""}</td>
  </tr>`;
}

function issueTable(group) {
  const rows = group.items && group.items.length
    ? group.items.map(issueRow).join("")
    : `<tr class="issue-empty-row" aria-label="该周没有遗留问题">${Array.from({ length: 11 }, () => "<td></td>").join("")}</tr>`;
  return `<section class="issue-week-section">
    <h2 class="issue-week-title">${esc(group.title || "问题")}</h2>
    <div class="issue-table-scroll">
      <table class="issue-table" aria-label="${esc(group.title || "问题清单")}">
        <colgroup>
          <col style="width:3.5%">
          <col style="width:11.5%">
          <col style="width:19.5%">
          <col style="width:19.5%">
          <col style="width:6.5%">
          <col style="width:6.5%">
          <col style="width:6.5%">
          <col style="width:6%">
          <col style="width:8%">
          <col style="width:6%">
          <col style="width:6.5%">
        </colgroup>
        <thead><tr>
          ${["Item", "子任务名称", "任务", "当前进展", "计划完成日期", "调整日期", "实际完成日期", "提出人", "责任部门", "责任人", "任务状态"]
            .map(label => `<th scope="col">${label}</th>`).join("")}
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </section>`;
}

function issueTables() {
  const issues = DATA.issues || { groups: [] };
  const groups = issues.groups || [];
  if (!groups.length) return '<main class="wrap board-empty">当前没有可展示的问题</main>';
  return `<main class="wrap issue-wrap" id="issue-content">
    ${groups.map(issueTable).join("")}
  </main>`;
}

function renderIssueSummary() {
  const issues = DATA.issues || {
    weekLabel: "", previousTotal: 0, currentTotal: 0, open: 0, closed: 0
  };
  document.getElementById("issue-summary").innerHTML = `
    <span class="issue-summary-title">最近两周：${esc(issues.weekLabel || "未填写")}</span>
    <span class="issue-stats">
      <span class="summary-pill">上周遗留 ${issues.previousTotal || 0}</span>
      <span class="summary-pill">本周新增 ${issues.currentTotal || 0}</span>
      <span class="summary-pill open">OPEN ${issues.open || 0}</span>
      <span class="summary-pill closed">CLOSED ${issues.closed || 0}</span>
    </span>`;
}

function buildSlider() {
  const slider = document.getElementById("pm-slider");
  const activePms = DATA.groups.map(group => group.pm);
  const roster = [...(DATA.pmRoster || [])];
  const activePmSet = new Set(activePms);
  const rosterSet = new Set(roster);
  const fixedNames = roster.filter(name => activePmSet.has(name));
  const extraNames = activePms.filter(name => !rosterSet.has(name));
  const names = [...fixedNames, ...extraNames];
  slider.innerHTML = names.map(name => {
    const groupIndex = activePms.indexOf(name);
    return groupIndex >= 0
      ? `<button type="button" class="pm-name ${groupIndex === curPm ? "current" : ""}" data-group="${groupIndex}" aria-pressed="${groupIndex === curPm}">${esc(name)}</button>`
      : `<span class="pm-name disabled">${esc(name)}</span>`;
  }).join("");
  slider.querySelectorAll("button[data-group]").forEach(button => {
    button.addEventListener("click", () => {
      curPm = Number(button.dataset.group);
      renderBoard(true);
    });
  });
  const current = slider.querySelector(".pm-name.current");
  if (current) current.scrollIntoView({ inline: "center", block: "nearest" });
}

function switchPmByDirection(direction) {
  const slider = document.getElementById("pm-slider");
  const buttons = [...slider.querySelectorAll("button[data-group]")];
  const currentIndex = buttons.findIndex(button => Number(button.dataset.group) === curPm);
  if (currentIndex < 0 || !buttons.length) return;
  const targetIndex = Math.max(0, Math.min(buttons.length - 1, currentIndex + direction));
  if (targetIndex === currentIndex) return;
  const hadSliderFocus = slider.contains(document.activeElement);
  curPm = Number(buttons[targetIndex].dataset.group);
  renderBoard(false);
  if (hadSliderFocus) {
    const current = slider.querySelector(`button[data-group="${curPm}"]`);
    if (current) current.focus({ preventScroll: true });
  }
}

function updateViewChrome() {
  const meetingActive = currentView === "meeting";
  const overviewActive = currentView === "overview";
  const progressActive = currentView === "progress";
  const issueActive = currentView === "issues";
  const meetingTab = document.getElementById("meeting-tab");
  const overviewTab = document.getElementById("overview-tab");
  const progressTab = document.getElementById("progress-tab");
  const issueTab = document.getElementById("issue-tab");
  const overviewEnabled = Boolean(DATA.projectOverview && DATA.projectOverview.enabled);
  const issueEnabled = Boolean(DATA.issues && DATA.issues.enabled);
  const meetingEnabled = Boolean(DATA.meetingDiscipline && DATA.meetingDiscipline.enabled);

  meetingTab.disabled = !meetingEnabled;
  meetingTab.classList.toggle("active", meetingActive);
  meetingTab.setAttribute("aria-pressed", String(meetingActive));
  overviewTab.disabled = !overviewEnabled;
  overviewTab.classList.toggle("active", overviewActive);
  overviewTab.setAttribute("aria-pressed", String(overviewActive));
  progressTab.classList.toggle("active", progressActive);
  progressTab.setAttribute("aria-pressed", String(progressActive));
  issueTab.disabled = !issueEnabled;
  issueTab.classList.toggle("active", issueActive);
  issueTab.setAttribute("aria-pressed", String(issueActive));
  document.getElementById("pm-slider").hidden = !progressActive;
  document.getElementById("issue-summary").hidden = !issueActive;

  document.getElementById("src-tag").textContent = meetingActive
    ? "会议纪律"
    : overviewActive ? "项目概况"
    : progressActive ? DATA.viewName : "遗留问题";
  document.getElementById("foot").textContent = meetingActive
    ? `内容来源：会议内容配置　·　生成于 ${DATA.generatedAt}`
    : overviewActive
      ? `数据来源：${DATA.viewName}（子任务与赛道）　·　生成于 ${DATA.generatedAt}`
    : progressActive
      ? `数据来源：${DATA.viewName}　·　生成于 ${DATA.generatedAt}`
      : `数据来源：遗留问题（${DATA.issues.viewName || "Base"}）　·　生成于 ${DATA.generatedAt}`;
}

function renderBoard(resetScroll) {
  const board = document.getElementById("board");
  if (currentView === "meeting") {
    board.innerHTML = meetingDisciplineView();
    updateViewChrome();
    if (resetScroll) scrollBoardIntoView(board);
    return;
  }
  if (currentView === "overview") {
    board.innerHTML = projectOverviewView();
    updateViewChrome();
    if (resetScroll) scrollBoardIntoView(board);
    return;
  }
  if (currentView === "issues") {
    renderIssueSummary();
    board.innerHTML = issueTables();
    updateViewChrome();
    if (resetScroll) scrollBoardIntoView(board);
    return;
  }

  const group = DATA.groups[curPm];
  if (!group) {
    board.innerHTML = '<div class="wrap board-empty">当前没有可展示的项目</div>';
    updateViewChrome();
    return;
  }
  const tdts = groupByTdt(group.projects);
  board.innerHTML = `<main class="wrap" id="pm-content">
    <div class="pm-summary">
      <h2>PM：${esc(group.pm)}</h2>
      <span>${group.projects.length} 个子任务</span>
    </div>
    ${tdts.map(tdtSection).join("")}
  </main>`;
  buildSlider();
  updateViewChrome();
  if (resetScroll) scrollBoardIntoView(board);
}

function scrollBoardIntoView(board) {
  const headerHeight = document.getElementById("sticky-head").offsetHeight;
  const top = board.getBoundingClientRect().top + window.scrollY - headerHeight - 8;
  window.scrollTo({ top, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}

function setView(view) {
  if (view === "meeting" && !(DATA.meetingDiscipline && DATA.meetingDiscipline.enabled)) return;
  if (view === "overview" && !(DATA.projectOverview && DATA.projectOverview.enabled)) return;
  if (view === "issues" && !(DATA.issues && DATA.issues.enabled)) return;
  currentView = view;
  renderBoard(true);
}

function hydrate(data) {
  const previousPm = DATA && DATA.groups && DATA.groups[curPm] ? DATA.groups[curPm].pm : "";
  DATA = data;
  if (currentView === "meeting" && !(DATA.meetingDiscipline && DATA.meetingDiscipline.enabled)) currentView = "progress";
  if (currentView === "overview" && !(DATA.projectOverview && DATA.projectOverview.enabled)) currentView = "progress";
  if (currentView === "issues" && !(DATA.issues && DATA.issues.enabled)) currentView = "progress";
  const previousIndex = DATA.groups.findIndex(group => group.pm === previousPm);
  curPm = previousIndex >= 0 ? previousIndex : Math.min(curPm, Math.max(DATA.groups.length - 1, 0));
  const total = DATA.groups.reduce((sum, group) => sum + group.projects.length, 0);
  document.getElementById("meta").innerHTML = `<b>${esc(DATA.week)}</b>　${total} 个子任务　数据截至 ${esc(DATA.generatedAt)}`;
  renderBoard(false);
}

if (DATA) hydrate(DATA);

const aiBtn = document.getElementById("ai-btn");
const aiText = document.getElementById("ai-btn-text");
const stage = document.getElementById("stage");
const stageDots = document.getElementById("stage-dots");
const stageHint = document.getElementById("stage-hint");
const gated = [document.getElementById("toolrow"), document.getElementById("board"), document.getElementById("foot")];
const SERVED = location.protocol === "http:" || location.protocol === "https:";
let generated = false;

document.getElementById("meeting-tab").addEventListener("click", () => setView("meeting"));
document.getElementById("overview-tab").addEventListener("click", () => setView("overview"));
document.getElementById("progress-tab").addEventListener("click", () => setView("progress"));
document.getElementById("issue-tab").addEventListener("click", () => setView("issues"));
document.addEventListener("keydown", event => {
  if (currentView !== "progress" || document.getElementById("board").hidden) return;
  if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
  if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
  const target = event.target;
  if (target && typeof target.matches === "function" && (target.matches("input, textarea, select") || target.isContentEditable)) return;
  event.preventDefault();
  switchPmByDirection(event.key === "ArrowLeft" ? -1 : 1);
});

function setLoading() {
  aiBtn.disabled = true;
  document.dispatchEvent(new CustomEvent("dashboard:loading"));
  aiBtn.classList.remove("done");
  aiBtn.classList.add("loading");
  aiText.textContent = "生成中";
  gated.forEach(element => element.hidden = true);
  stage.hidden = false;
  stageDots.hidden = false;
  stageHint.textContent = SERVED ? "AI 正在读取项目概况、详细进展与遗留问题数据源并汇总最新状态…" : "AI 正在汇总本周项目状态…";
}

function reveal() {
  stage.hidden = true;
  gated.forEach(element => { element.hidden = false; element.classList.add("reveal"); });
  aiBtn.disabled = false;
  aiBtn.classList.remove("loading");
  aiBtn.classList.add("done");
  aiText.textContent = "重新生成";
  generated = true;
  document.dispatchEvent(new CustomEvent("dashboard:ready"));
}

const NETWORK_RETRY_DELAYS_MS = [800, 1600];

async function fetchDashboardData(fetchImpl = fetch, waitImpl = delay => new Promise(resolve => setTimeout(resolve, delay))) {
  for (let attempt = 0; attempt <= NETWORK_RETRY_DELAYS_MS.length; attempt += 1) {
    try {
      const response = await fetchImpl("/api/data", { cache: "no-store" });
      if (!response.ok) {
        let message = "HTTP " + response.status;
        try { message = (await response.json()).error || message; } catch (error) {}
        throw new Error(message);
      }
      return await response.json();
    } catch (error) {
      const canRetry = error instanceof TypeError && attempt < NETWORK_RETRY_DELAYS_MS.length;
      if (!canRetry) {
        if (error instanceof TypeError) {
          throw new Error("本地看板服务连接中断，已自动重试2次仍未恢复；请确认CMD窗口仍在运行，或按F5后重试");
        }
        throw error;
      }
      await waitImpl(NETWORK_RETRY_DELAYS_MS[attempt]);
    }
  }
  throw new Error("本地看板服务连接中断");
}

aiBtn.addEventListener("click", async () => {
  setLoading();
  if (SERVED) {
    try {
      hydrate(await fetchDashboardData());
    } catch (error) {
      stageDots.hidden = true;
      stageHint.textContent = "刷新失败：" + error.message + (generated ? "（继续显示上次数据）" : "（显示页面内置快照）");
      setTimeout(reveal, 1500);
      return;
    }
  } else {
    const wait = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 1200;
    await new Promise(resolve => setTimeout(resolve, wait));
  }
  reveal();
});

</script>
<script>
(() => {
  const presentationBtn = document.getElementById("presentation-btn");
  const presentationText = document.getElementById("presentation-btn-text");
  const stickyHead = document.getElementById("sticky-head");
  const hotzone = document.getElementById("presentation-hotzone");
  const PRESENTATION_IDLE_MS = 2800;
  const TOP_REVEAL_PX = 18;
  let presentationMode = false;
  let presentationFallback = false;
  let presentationHideTimer = null;

  function syncPresentationHeaderHeight() {
    const height = Math.ceil(stickyHead.getBoundingClientRect().height);
    document.documentElement.style.setProperty("--presentation-header-height", `${height}px`);
  }

  function schedulePresentationChromeHide() {
    clearTimeout(presentationHideTimer);
    if (!presentationMode) return;
    presentationHideTimer = setTimeout(() => {
      document.body.classList.add("presentation-controls-hidden");
    }, PRESENTATION_IDLE_MS);
  }

  function showPresentationChrome() {
    if (!presentationMode) return;
    document.body.classList.remove("presentation-controls-hidden");
    syncPresentationHeaderHeight();
    schedulePresentationChromeHide();
  }

  function setPresentationMode(active, fallback = false) {
    presentationMode = active;
    presentationFallback = active && fallback;
    document.body.classList.toggle("presentation-mode", active);
    document.body.classList.remove("presentation-controls-hidden");
    presentationBtn.setAttribute("aria-pressed", String(active));
    presentationText.textContent = active ? "退出演示" : "演示模式";
    presentationBtn.title = presentationFallback ? "浏览器未允许原生全屏，当前为铺满窗口模式" : "";
    if (active) {
      syncPresentationHeaderHeight();
      schedulePresentationChromeHide();
    } else {
      clearTimeout(presentationHideTimer);
      document.documentElement.style.setProperty("--presentation-header-height", "0px");
    }
  }

  async function togglePresentationMode() {
    if (presentationMode) {
      if (document.fullscreenElement && document.exitFullscreen) {
        try {
          await document.exitFullscreen();
        } catch (error) {
          setPresentationMode(false);
        }
      } else {
        setPresentationMode(false);
      }
      return;
    }

    if (document.fullscreenEnabled && document.documentElement.requestFullscreen) {
      try {
        await document.documentElement.requestFullscreen();
        return;
      } catch (error) {}
    }
    setPresentationMode(true, true);
  }

  presentationBtn.addEventListener("click", togglePresentationMode);
  hotzone.addEventListener("pointerenter", showPresentationChrome);
  hotzone.addEventListener("pointerdown", showPresentationChrome);
  stickyHead.addEventListener("pointerenter", showPresentationChrome);
  stickyHead.addEventListener("pointermove", showPresentationChrome, { passive: true });
  document.addEventListener("pointermove", event => {
    if (presentationMode && event.clientY <= TOP_REVEAL_PX) showPresentationChrome();
  }, { passive: true });
  document.addEventListener("fullscreenchange", () => {
    if (document.fullscreenElement) setPresentationMode(true);
    else if (!presentationFallback) setPresentationMode(false);
  });
  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && presentationMode && !document.fullscreenElement) {
      event.preventDefault();
      setPresentationMode(false);
    }
  });
  document.addEventListener("dashboard:loading", () => {
    presentationBtn.disabled = true;
  });
  document.addEventListener("dashboard:ready", () => {
    presentationBtn.disabled = false;
    syncPresentationHeaderHeight();
  });
  window.addEventListener("resize", () => {
    if (presentationMode) syncPresentationHeaderHeight();
  });
})();
</script>
</body>
